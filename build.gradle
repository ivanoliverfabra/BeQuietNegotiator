plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
}

group = project.maven_group
version = "${property("mod_version")}+${property("deps_minecraft_version")}"

base {
    archivesName = project.archives_name
}

def javaVersion = Integer.parseInt(property("deps_java_version").toString())

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

neoForge {
    version = property("deps_neoforge_version")

    accessTransformers = files("$rootDir/src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        client {
            client()
        }
    }

    mods {
        be_quiet_negotiator {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def props = [
            version                       : project.version,
            deps_minecraft_supported_range: project.property("deps_minecraft_supported_range"),
            deps_neoforge_supported_range : project.property("deps_neoforge_supported_range"),
            deps_mixin_compatibility_level: project.property("deps_mixin_compatibility_level")
    ]
    inputs.properties props

    filesMatching(['META-INF/neoforge.mods.toml', 'be_quiet_negotiator.mixins.json']) {
        expand(props)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
